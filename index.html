<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Love You Aruuu ❤️</title>

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========================= -->
  <!-- GLOBAL PARTICLES -->
  <!-- ========================= -->
  <div class="particles"></div>
  <div class="stars"></div>

  <!-- ========================= -->
  <!-- PAGE 1 : PREMIUM INTRO -->
  <!-- ========================= -->
  <section id="page1" class="page active">

    <!-- Background glow -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- Floating hearts -->
    <div class="floating-hearts">
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
    </div>

    <div class="intro-container">

      <!-- Premium Heart -->
      <div class="heart-wrapper" id="heartWrapper">

        <!-- outer ring -->
        <div class="heart-ring ring-1"></div>
        <div class="heart-ring ring-2"></div>

        <!-- main heart -->
        <div class="main-heart" id="mainHeart">
          ❤
        </div>

        <!-- crack effect -->
        <div class="heart-crack" id="heartCrack"></div>

        <!-- explosion particles -->
        <div class="explosion" id="explosion">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>

      </div>

      <!-- Intro Text -->
      <div class="intro-text">
        <p class="small-text">Something magical is loading...</p>

        <h1 class="main-title">
          I Love You
          <span class="name">Aruuu ❤</span>
        </h1>

        <p class="sub-title">
          Every heartbeat of mine belongs to you ✨
        </p>
      </div>

      <!-- Premium Button -->
      <button id="startBtn" class="premium-btn">
        <span class="btn-bg"></span>
        <span class="btn-glow"></span>
        <span class="btn-text">Touch My Heart</span>
      </button>

      <!-- Scroll hint -->
      <div class="scroll-hint">
        <span></span>
      </div>

    </div>
  </section>

  <!-- ========================= -->
  <!-- PAGE 2 PLACEHOLDER -->
  <!-- (NEXT PART E DIBO) -->
  <!-- ========================= -->
  <section id="page2" class="page hidden">
    <!-- PART 1B E EIKHANE CODE BOSBE -->
  </section>

  <!-- ========================= -->
  <!-- PAGE 3 PLACEHOLDER -->
  <!-- ========================= -->
  <section id="page3" class="page hidden">
    <!-- PART 1B E EIKHANE CODE BOSBE -->
  </section>

  <!-- ========================= -->
  <!-- PAGE 4 PLACEHOLDER -->
  <!-- ========================= -->
  <section id="page4" class="page hidden">
    <!-- PART 1C E EIKHANE CODE BOSBE -->
  </section>

  <!-- ========================= -->
  <!-- FINAL PAGE PLACEHOLDER -->
  <!-- ========================= -->
  <section id="finalPage" class="page hidden">
    <!-- PART 1C E EIKHANE CODE BOSBE -->
  </section>

  <!-- Main JS -->
  <script src="script.js"></script>
</body>
</html>
