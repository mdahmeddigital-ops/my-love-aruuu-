<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>I Love You Aruuu ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap"
rel="stylesheet">

</head>

<body>

<!-- ====================================== -->
<!-- Loading Screen -->
<!-- ====================================== -->

<div id="loading-screen">

<div class="loader-heart">

❤️

</div>

<h2 class="loading-text">

Loading Love...

</h2>

</div>

<!-- ====================================== -->
<!-- Floating Hearts -->
<!-- ====================================== -->

<div id="hearts-container"></div>

<!-- ====================================== -->
<!-- Main Website -->
<!-- ====================================== -->

<main id="website">

<!-- PAGE 1 START -->

<section id="page1" class="page active">

<!-- Premium Background -->

<div class="bg-glow"></div>

<div class="stars"></div>

<div class="particles"></div>

<!-- Error Heart -->

<div class="error-container">

<div id="errorHeart" class="main-heart">

❤️

</div>

<h1 class="error-title">

SYSTEM ERROR

</h1>

<p class="error-subtitle">

Searching For True Love...

</p>

</div>

<!-- Welcome -->

<div class="welcome-box">

<h2 class="love-title">

I Love You

</h2>

<h1 class="aruuu">

Aruuu ❤️

</h1>

<p class="love-desc">

Every heartbeat reminds me of you...

</p>

<button id="startBtn">

Touch My Heart ❤️

</button>

</div>

<!-- Floating Hearts -->

<div class="heart-layer"></div>

<div class="heart-layer two"></div>

<div class="heart-layer three"></div>

<!-- Shine -->

<div class="shine"></div>


<!-- Premium Heart Break Effect -->

<div id="heartExplosion">

<div class="blast blast1"></div>
<div class="blast blast2"></div>
<div class="blast blast3"></div>
<div class="blast blast4"></div>
<div class="blast blast5"></div>
<div class="blast blast6"></div>
<div class="blast blast7"></div>
<div class="blast blast8"></div>
<div class="blast blast9"></div>
<div class="blast blast10"></div>

</div>

<div id="whiteFlash"></div>

<div id="screenFade"></div>

<div id="transitionLayer">

<div class="transitionHeart">❤️</div>

<h2>Entering Love World...</h2>

</div>
</section>

<!-- PAGE 1 END -->

<!-- PAGE 2 START -->

<section id="page2" class="page">

<!-- Next Part -->

</section>

<!-- PAGE 2 END -->

<!-- PAGE 3 START -->

<section id="page3" class="page">

<!-- Next Part -->

</section>

<!-- PAGE 3 END -->

<!-- PAGE 4 START -->

<section id="page4" class="page">

<!-- Next Part -->

</section>

<!-- PAGE 4 END -->

<!-- PAGE 5 START -->

<section id="page5" class="page">

<!-- Next Part -->

</section>

<!-- PAGE 5 END -->

<!-- PAGE 6 START -->

<section id="page6" class="page">

<!-- Final Page -->

</section>

<!-- PAGE 6 END -->

</main>

<script src="script.js"></script>

</body>

</html>
